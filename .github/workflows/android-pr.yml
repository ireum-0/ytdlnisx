name: Android PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Check patch whitespace
        run: |
          git diff --check
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin -x lint

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest
