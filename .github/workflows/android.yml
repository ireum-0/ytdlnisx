name: Android CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  main_project_module: app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Create CI local.properties
        run: touch local.properties

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin -x lint

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest

  release-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Create signing files
        shell: bash
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          printf '%s' "$BASE_64_SIGNING_KEY" | base64 --decode > app/release_keystore.jks
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          touch local.properties

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build release APKs
        run: ./gradlew assemble --warning-mode all

      - name: Find arm64 release APK
        run: echo "APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/release/ -type f -name '*arm64*.apk')" >> "$GITHUB_ENV"

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ytdlnis-autogenerated-arm64-v8a-release
          path: ${{ env.APK_PATH }}

      - name: Find armeabi-v7a release APK
        run: echo "APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/release/ -type f -name '*armeabi*.apk')" >> "$GITHUB_ENV"

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ytdlnis-autogenerated-armeabi-v7a-release
          path: ${{ env.APK_PATH }}

      - name: Find universal release APK
        run: echo "APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/release/ -type f -name '*universal*.apk')" >> "$GITHUB_ENV"

      - name: Upload universal release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ytdlnis-autogenerated-universal-release
          path: ${{ env.APK_PATH }}

      - name: Find x86 release APK
        run: echo "APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/release/ -type f -name '*x86-*.apk')" >> "$GITHUB_ENV"

      - name: Upload x86 release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ytdlnis-autogenerated-x86-release
          path: ${{ env.APK_PATH }}

      - name: Find x86_64 release APK
        run: echo "APK_PATH=$(find ${{ env.main_project_module }}/build/outputs/apk/release/ -type f -name '*x86_64*.apk')" >> "$GITHUB_ENV"

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ytdlnis-autogenerated-x86_64-release
          path: ${{ env.APK_PATH }}

      - name: Upload all release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: YTDLnis APK release generated
          path: ${{ env.main_project_module }}/build/outputs/apk/release/

      - name: Remove signing files
        if: ${{ always() }}
        run: rm -f app/release_keystore.jks keystore.properties local.properties

  notify:
    needs: release-build
    if: ${{ always() && needs.release-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram notification
        continue-on-error: true
        uses: appleboy/telegram-action@4cd2253b24c9682a5be99eb6f7ab3484586978fa # master pinned 2026-07-13
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ github.actor }} created commit:
            Commit message: ${{ github.event.commits[0].message }}
            Repository: ${{ github.repository }}
            See changes: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
